default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: xiamen_development

test:
  <<: *default
  database: xiamen_test

production:
  primary:
    <<: *default
    database: xiamen_production
    host: <%= ENV["DB_HOST"] %>
    username: <%= ENV["DB_USERNAME"] %>
    password: <%= ENV.fetch("DB_PASSWORD").to_json %>

  cache:
    <<: *default
    database: xiamen_production_cache
    host: <%= ENV["DB_HOST"] %>
    username: <%= ENV["DB_USERNAME"] %>
    password: <%= ENV.fetch("DB_PASSWORD").to_json %>
    migrations_paths: db/cache_migrate

  queue:
    <<: *default
    database: xiamen_production_queue
    host: <%= ENV["DB_HOST"] %>
    username: <%= ENV["DB_USERNAME"] %>
    password: <%= ENV.fetch("DB_PASSWORD").to_json %>
    migrations_paths: db/queue_migrate

  cable:
    <<: *default
    database: xiamen_production_cable
    host: <%= ENV["DB_HOST"] %>
    username: <%= ENV["DB_USERNAME"] %>
    password: <%= ENV.fetch("DB_PASSWORD").to_json %>
    migrations_paths: db/cable_migrate
